steps:
  # ============================
  # DEPLOY MAIN (PRODUÇÃO)
  # ============================
  - name: deploy-main
    image: alpine
    when:
      event: push
      branch: main

    environment:
      SSH_KEY:
        from_secret: EC2_SSH_KEY
      EC2_HOST:
        from_secret: EC2_PUBLIC_IP
      EC2_USER: ubuntu

    commands:
      - apk add --no-cache openssh-client git docker-cli

      - echo "$SSH_KEY" > private_key.pem
      - chmod 600 private_key.pem

      - |
        ssh -o StrictHostKeyChecking=no \
            -o ServerAliveInterval=60 \
            -o ServerAliveCountMax=10 \
            -i private_key.pem $EC2_USER@$EC2_HOST << 'EOF'
        set -e

        cd /home/ubuntu/projects/geolocation
        
        REDIS_PASS=$(grep "^REDIS_PASSWORD=" .env | cut -d '=' -f2- | tr -d '\r' | tr -d '"')
        
        if [ -z "$REDIS_PASS" ]; then
          echo "ERRO: Senha do Redis não encontrada no .env!"
          exit 1
        fi

        git fetch --all
        git checkout main
        git pull origin main

        docker build -t go-geolocation .

        docker stop go-geolocation-container || true
        docker rm go-geolocation-container || true
        
        docker stop prod-redis || true
        docker rm prod-redis || true
        
        docker run -d -p 6379:6379 \
          --name prod-redis \
          redis:alpine redis-server --requirepass "$REDIS_PASS"

        docker run -d -p 9912:8080 \
          --env-file .env \
          --name go-geolocation-container \
          go-geolocation
        
        docker image prune -f
        EOF

      - rm -f private_key.pem